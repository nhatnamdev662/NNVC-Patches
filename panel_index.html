<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NNVC Hub — Quản Lý Cập Nhật</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #0a84ff;
      --accent: #0a84ff;
      --accent-hover: #0070e0;
      --accent-glow: rgba(10, 132, 255, 0.25);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --danger: #ff453a;
      --success: #30d158;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }

    /* Login Screen */
    .pin-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }
    .pin-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
    .pin-desc { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1.8rem; }
    .pin-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem;
      font-size: 1.5rem;
      color: #fff;
      text-align: center;
      letter-spacing: 0.35rem;
      outline: none;
      margin-bottom: 1.2rem;
      transition: all 0.2s;
    }
    .pin-input:focus { border-color: var(--border-focus); box-shadow: 0 0 15px var(--accent-glow); }

    /* Main Container */
    .app-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.2rem;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      display: none;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.8rem; }
    .header h1 { font-size: 1.35rem; font-weight: 800; }
    .status-pill {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--success);
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.25);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

    /* Drop Box */
    .drop-box {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 1.6rem 1rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1.8rem;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s;
    }
    .drop-box:hover, .drop-box.dragover { border-color: var(--accent); background: rgba(10, 132, 255, 0.06); }
    .drop-box-icon { font-size: 2rem; margin-bottom: 0.4rem; }
    .drop-box-text { font-size: 0.92rem; font-weight: 600; }
    .drop-box-sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.2rem; }

    /* Form Fields */
    .row { display: flex; gap: 1rem; margin-bottom: 1.2rem; }
    .col { flex: 1; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.45rem; color: #cbd5e1; }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--border-focus); box-shadow: 0 0 12px var(--accent-glow); }
    textarea { height: 80px; resize: none; font-size: 0.85rem; line-height: 1.4; }

    /* Toggle Switch */
    .switch-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
    }
    .switch-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.2rem; }
    .switch-desc { font-size: 0.78rem; color: var(--text-dim); }
    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      cursor: pointer;
      transition: 0.3s;
    }
    .toggle.active { background: var(--danger); }
    .toggle-circle {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle.active .toggle-circle { left: 25px; }

    /* Action Button */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.95rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 0.8rem 1.4rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Pin Screen -->
  <div class="pin-card" id="pinCard">
    <div style="font-size: 2.2rem; margin-bottom: 0.6rem;">⚡</div>
    <div class="pin-title">NNVC Quản Trị</div>
    <div class="pin-desc">Nhập mã PIN để truy cập bảng điều khiển</div>
    <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8" autofocus onkeypress="if(event.key==='Enter') login()">
    <button class="btn" onclick="login()">Đăng Nhập</button>
  </div>

  <!-- Main App Screen -->
  <div class="app-card" id="appCard">
    <div class="header">
      <div>
        <h1>⚡ Bảng Quản Trị Bản Vá NNVC</h1>
        <div style="font-size: 0.78rem; color: var(--text-dim); margin-top: 0.2rem;">nnvcpanel.netlify.app</div>
      </div>
      <div class="status-pill"><div class="status-dot"></div> Trực Tuyến</div>
    </div>

    <!-- Drop APK -->
    <div class="drop-box" id="dropBox" onclick="document.getElementById('fileInput').click()">
      <div class="drop-box-icon">📦</div>
      <div class="drop-box-text" id="dropTitle">Kéo thả file APK vào đây</div>
      <div class="drop-box-sub" id="dropSub">Tự động tính mã băm SHA-256 xác thực</div>
      <input type="file" id="fileInput" accept=".apk" style="display: none;" onchange="handleFile(this.files)">
    </div>

    <!-- Inputs -->
    <div class="row">
      <div class="col">
        <label>Số Phiên Bản Mới</label>
        <input type="text" id="vName" value="1.0.0" placeholder="1.0.1">
      </div>
      <div class="col">
        <label>Mã Phiên Bản (Số)</label>
        <input type="number" id="vCode" value="10000" placeholder="10001">
      </div>
    </div>

    <div style="margin-bottom: 1.2rem;">
      <label>Link Tải Trực Tiếp File APK</label>
      <input type="text" id="dlUrl" value="https://github.com/nhatnamdev662/NNVC-Patches/releases/download/v1.0.0/chess_4.10.20_nnvc_signed.apk" placeholder="https://github.com/.../app.apk">
    </div>

    <div style="margin-bottom: 1.2rem;">
      <label>Mã SHA-256 (Tự điền khi thả file APK)</label>
      <input type="text" id="sha256" placeholder="Mã băm an toàn 64 ký tự..." readonly style="background: rgba(0,0,0,0.4); color: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;">
    </div>

    <div style="margin-bottom: 1.4rem;">
      <label>Nội Dung Bản Vá (Changelog)</label>
      <textarea id="changelog">🛡️ NNVC v1.0.0 — Bản Phát Hành Chính Thức Milestone
- Tích hợp động cơ Stockfish 18 & Komodo 3.3
- Sửa triệt để lỗi văng trang cá nhân
- Hỗ trợ cập nhật trực tiếp trong ứng dụng</textarea>
    </div>

    <!-- Force Update Switch -->
    <div class="switch-box">
      <div>
        <div class="switch-title">Bắt Buộc Cập Nhật (Khóa App)</div>
        <div class="switch-desc">Khi bật, người dùng bắt buộc phải cài bản mới mới chơi được</div>
      </div>
      <div class="toggle" id="forceToggle" onclick="toggleForce()">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <!-- Download JSON -->
    <button class="btn" onclick="saveConfig()">
      <span>💾</span> Tải File version.json Mới
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let isForce = false;
    let sha256Hash = "77c494150f9640e329d2ba9e46f049784aaee853151994c28f90c796de022045";

    function login() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin === "662266") {
        document.getElementById('pinCard').style.display = 'none';
        document.getElementById('appCard').style.display = 'block';
        showToast("Đăng nhập thành công!");
      } else {
        alert("Mã PIN không đúng!");
      }
    }

    function toggleForce() {
      isForce = !isForce;
      document.getElementById('forceToggle').classList.toggle('active', isForce);
    }

    // Drag and Drop APK
    const dropBox = document.getElementById('dropBox');
    ['dragenter', 'dragover'].forEach(e => {
      dropBox.addEventListener(e, (ev) => { ev.preventDefault(); dropBox.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(e => {
      dropBox.addEventListener(e, (ev) => { ev.preventDefault(); dropBox.classList.remove('dragover'); });
    });
    dropBox.addEventListener('drop', (ev) => {
      ev.preventDefault();
      if (ev.dataTransfer.files.length) handleFile(ev.dataTransfer.files);
    });

    async function handleFile(files) {
      if (!files || !files[0]) return;
      const file = files[0];
      document.getElementById('dropTitle').innerText = "Đang quét: " + file.name;
      document.getElementById('dropSub').innerText = (file.size / (1024 * 1024)).toFixed(2) + " MB";

      try {
        const buffer = await file.arrayBuffer();
        const digest = await crypto.subtle.digest('SHA-256', buffer);
        sha256Hash = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        document.getElementById('sha256').value = sha256Hash;
        document.getElementById('dropTitle').innerText = "✅ Đã quét xong: " + file.name;
        showToast("Đã tính xong mã SHA-256!");
      } catch (e) {
        alert("Lỗi khi đọc file APK: " + e.message);
      }
    }

    function saveConfig() {
      const config = {
        version_code: parseInt(document.getElementById('vCode').value) || 10000,
        version_name: document.getElementById('vName').value.trim() || "1.0.0",
        changelog: document.getElementById('changelog').value.trim(),
        download_url: document.getElementById('dlUrl').value.trim(),
        sha256: sha256Hash || "",
        hmac_sha256: "9b12a884fe081c784918e77823f03b22cf331dc8e1a7ba9310df6663f7215904",
        force_update: isForce,
        min_supported_version: isForce ? (parseInt(document.getElementById('vCode').value) || 10000) : 10000,
        announcement: {
          enabled: true,
          id: "ann_nnvc_" + Date.now(),
          title: "Thông Báo Bản Vá NNVC",
          message: "Đã có bản cập nhật mới v" + (document.getElementById('vName').value.trim() || "1.0.0"),
          action_text: "Chi tiết",
          action_url: "https://t.me/nncutett"
        }
      };

      const jsonStr = JSON.stringify(config, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "version.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Đã tải tệp version.json!");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }
  </script>
</body>
</html>
